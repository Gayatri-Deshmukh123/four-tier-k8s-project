apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-primary-pvc
  namespace: student-project
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-primary-config
  namespace: student-project
data:
  primary-config.cnf: |
    [mysqld]
    server_id=1
    log_bin=mysql-bin
    binlog_format=ROW
    bind_address=0.0.0.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-primary
  namespace: student-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-primary
  template:
    metadata:
      labels:
        app: db-primary
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-db-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MARIADB_DATABASE
              value: studentdb
            - name: MARIADB_USER
              value: appuser
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-db-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
            - name: db-config
              mountPath: /etc/mysql/conf.d/primary-config.cnf
              subPath: primary-config.cnf
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-primary-pvc
        - name: db-config
          configMap:
            name: db-primary-config
---
apiVersion: v1
kind: Service
metadata:
  name: db-primary
  namespace: student-project
spec:
  selector:
    app: db-primary
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP
