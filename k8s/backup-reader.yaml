apiVersion: v1
kind: Pod
metadata:
  name: backup-reader
  namespace: student-project
spec:
  containers:
    - name: reader
      image: busybox
      command: ["sh", "-c", "sleep 36000"]
      volumeMounts:
        - name: backup-storage
          mountPath: /backup
  volumes:
    - name: backup-storage
      persistentVolumeClaim:
        claimName: db-backup-pvc
